      APP_DOCKER_R2DBC_URL: "r2dbc:postgresql://postgres:5432/arkab2b_notification"
      APP_DOCKER_R2DBC_USERNAME: "notification"
      APP_DOCKER_R2DBC_PASSWORD: "notification"
      APP_DOCKER_REDIS_HOST: redis
      APP_DOCKER_REDIS_PORT: "6379"
      APP_DOCKER_REDIS_PASSWORD: ""
      APP_DOCKER_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      APP_DOCKER_KAFKA_CLIENT_ID: "notification-service-cloud"

  reporting-service:

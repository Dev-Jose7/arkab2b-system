server:
  port: ${SERVER_PORT:8081}

app:
  security:
    jwt:
      algorithm: ${APP_SECURITY_JWT_ALGORITHM:RS256}
      key-id: ${APP_SECURITY_JWT_KEY_ID:dev-rsa-key-1}
      private-key-path: ${APP_SECURITY_JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${APP_SECURITY_JWT_PUBLIC_KEY_PATH:}
      additional-public-keys: ${APP_SECURITY_JWT_ADDITIONAL_PUBLIC_KEYS:}
      issuer: ${APP_SECURITY_JWT_ISSUER:identity-access-service}
      audience: ${APP_SECURITY_JWT_AUDIENCE:arka-b2b}
      jwks-path: ${APP_SECURITY_JWT_JWKS_PATH:/.well-known/jwks.json}
  external:
    notification:
      base-url: ${APP_EXTERNAL_NOTIFICATION_BASE_URL:http://notification-service}
      timeout-ms: ${APP_EXTERNAL_NOTIFICATION_TIMEOUT_MS:3000}
      emit-path: ${APP_EXTERNAL_NOTIFICATION_EMIT_PATH:/api/v1/notifications}

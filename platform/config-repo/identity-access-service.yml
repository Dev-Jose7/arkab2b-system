server:
  port: ${SERVER_PORT:8081}

app:
  security:
    jwt:
      algorithm: ${APP_SECURITY_JWT_ALGORITHM:RS256}
      key-id: ${APP_SECURITY_JWT_KEY_ID:dev-rsa-key-1}
      private-key-path: ${APP_SECURITY_JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${APP_SECURITY_JWT_PUBLIC_KEY_PATH:}
      additional-public-keys: ${APP_SECURITY_JWT_ADDITIONAL_PUBLIC_KEYS:}
      issuer: ${APP_SECURITY_JWT_ISSUER:identity-access-service}
      audience: ${APP_SECURITY_JWT_AUDIENCE:arka-b2b}
      jwks-path: ${APP_SECURITY_JWT_JWKS_PATH:/.well-known/jwks.json}
    s2s:
      enabled: ${APP_SECURITY_S2S_ENABLED:true}
      default-token-ttl-seconds: ${APP_SECURITY_S2S_DEFAULT_TOKEN_TTL_SECONDS:300}
      client-id: ${APP_SECURITY_S2S_CLIENT_ID:identity-access-service}
      client-secret: ${APP_SECURITY_S2S_CLIENT_SECRET:${APP_S2S_SECRET_IDENTITY_ACCESS:identity-access-service-secret}}
      audience: ${APP_SECURITY_S2S_AUDIENCE:arka-b2b}
      scopes: ${APP_SECURITY_S2S_SCOPES:notification.dispatch,iam.permission.read}
      identity-base-url: ${APP_SECURITY_S2S_IDENTITY_BASE_URL:http://identity-access-service}
      token-path: ${APP_SECURITY_S2S_TOKEN_PATH:/api/v1/internal/auth/service-token}
      timeout-ms: ${APP_SECURITY_S2S_TIMEOUT_MS:2000}
      refresh-skew-seconds: ${APP_SECURITY_S2S_REFRESH_SKEW_SECONDS:30}
      clients:
        identity-access-service:
          client-secret: ${APP_S2S_SECRET_IDENTITY_ACCESS:identity-access-service-secret}
          scopes:
            - notification.dispatch
            - iam.permission.read
          audiences:
            - arka-b2b
          roles:
            - TRUSTED_SERVICE
          token-ttl-seconds: 300
        directory-service:
          client-secret: ${APP_S2S_SECRET_DIRECTORY:directory-service-secret}
          scopes:
            - directory.read
            - directory.organization.read
            - directory.profile.read
            - iam.permission.read
          audiences:
            - arka-b2b
          roles:
            - TRUSTED_SERVICE
          token-ttl-seconds: 300
        catalog-service:
          client-secret: ${APP_S2S_SECRET_CATALOG:catalog-service-secret}
          scopes:
            - catalog.read
            - directory.read
            - iam.permission.read
          audiences:
            - arka-b2b
          roles:
            - TRUSTED_SERVICE
          token-ttl-seconds: 300
        inventory-service:
          client-secret: ${APP_S2S_SECRET_INVENTORY:inventory-service-secret}
          scopes:
            - inventory.read
            - inventory.reserve
            - catalog.read
            - directory.read
            - order.read
            - iam.permission.read
          audiences:
            - arka-b2b
          roles:
            - TRUSTED_SERVICE
          token-ttl-seconds: 300
        order-service:
          client-secret: ${APP_S2S_SECRET_ORDER:order-service-secret}
          scopes:
            - order.read
            - order.write
            - inventory.read
            - inventory.reserve
            - catalog.read
            - directory.read
            - iam.permission.read
          audiences:
            - arka-b2b
          roles:
            - TRUSTED_SERVICE
          token-ttl-seconds: 300
        notification-service:
          client-secret: ${APP_S2S_SECRET_NOTIFICATION:notification-service-secret}
          scopes:
            - notification.dispatch
            - order.read
            - inventory.read
            - directory.read
            - iam.permission.read
          audiences:
            - arka-b2b
          roles:
            - TRUSTED_SERVICE
          token-ttl-seconds: 300
        reporting-service:
          client-secret: ${APP_S2S_SECRET_REPORTING:reporting-service-secret}
          scopes:
            - reporting.ingest
            - order.read
            - inventory.read
            - catalog.read
            - directory.read
            - notification.dispatch
            - iam.permission.read
          audiences:
            - arka-b2b
          roles:
            - TRUSTED_SERVICE
          token-ttl-seconds: 300
        api-gateway:
          client-secret: ${APP_S2S_SECRET_API_GATEWAY:api-gateway-secret}
          scopes:
            - order.read
            - catalog.read
            - directory.read
            - inventory.read
          audiences:
            - arka-b2b
          roles:
            - TRUSTED_SERVICE
          token-ttl-seconds: 180
  external:
    notification:
      base-url: ${APP_EXTERNAL_NOTIFICATION_BASE_URL:http://notification-service}
      service-token: ${APP_EXTERNAL_NOTIFICATION_SERVICE_TOKEN:}
      timeout-ms: ${APP_EXTERNAL_NOTIFICATION_TIMEOUT_MS:3000}
      emit-path: ${APP_EXTERNAL_NOTIFICATION_EMIT_PATH:/api/v1/notifications}

server:
  port: ${SERVER_PORT:8086}

app:
  kafka:
    topics:
      relevant-change-notification-emitted: ${APP_KAFKA_TOPIC_RELEVANT_CHANGE_NOTIFICATION_EMITTED:notification.relevant-change-notification-emitted.v1}
      notification-delivery-recorded: ${APP_KAFKA_TOPIC_NOTIFICATION_DELIVERY_RECORDED:notification.notification-delivery-recorded.v1}
      notification-mutation: ${APP_KAFKA_TOPIC_NOTIFICATION_MUTATION:notification.mutation.v1}
    consumers:
      order-events:
        enabled: ${APP_KAFKA_CONSUMER_ORDER_EVENTS_ENABLED:true}
        group-id: ${APP_KAFKA_CONSUMER_ORDER_EVENTS_GROUP_ID:notification-order-events-consumer}
        topics: ${APP_KAFKA_CONSUMER_ORDER_EVENTS_TOPICS:order.events.v1,order.cart.events.v1,inventory.stock-updated.v1,inventory.commitable-availability-recalculated.v1}
        channel: ${APP_KAFKA_CONSUMER_ORDER_EVENTS_CHANNEL:EMAIL}
        actor-id: ${APP_KAFKA_CONSUMER_ORDER_EVENTS_ACTOR_ID:notification-kafka-consumer}
        processing-timeout-ms: ${APP_KAFKA_CONSUMER_ORDER_EVENTS_PROCESSING_TIMEOUT_MS:8000}
        retry-backoff-ms: ${APP_KAFKA_CONSUMER_ORDER_EVENTS_RETRY_BACKOFF_MS:1000}
        max-retries: ${APP_KAFKA_CONSUMER_ORDER_EVENTS_MAX_RETRIES:3}
        dlq-suffix: ${APP_KAFKA_CONSUMER_ORDER_EVENTS_DLQ_SUFFIX:.dlq}
        supported-event-types: ${APP_KAFKA_CONSUMER_ORDER_EVENTS_SUPPORTED_EVENT_TYPES:OrderCreatedFromValidatedCart,OrderOperationalStatusUpdated,OrderFinancialStatusUpdated,ManualPaymentRegistered,OrderAdjustedBeforeClose,OrderConsistencyRevalidated,CartCreated,CartItemsAdjusted,CheckoutAvailabilityValidated,StockUpdated,CommitableAvailabilityRecalculated}
  outbox:
    relay:
      enabled: ${APP_OUTBOX_RELAY_ENABLED:true}
      batch-size: ${APP_OUTBOX_RELAY_BATCH_SIZE:200}
      poll-interval-ms: ${APP_OUTBOX_RELAY_POLL_INTERVAL_MS:2000}
      max-retries: ${APP_OUTBOX_RELAY_MAX_RETRIES:3}
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:identity-access-service}
      allowed-audiences: ${APP_SECURITY_JWT_ALLOWED_AUDIENCES:arka-b2b,notification-service}
      jwks-uri: ${APP_SECURITY_JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    actor:
      fallback-enabled: ${APP_SECURITY_ACTOR_FALLBACK_ENABLED:false}
      fallback-organization-id: 
      fallback-country-code: ${APP_SECURITY_ACTOR_FALLBACK_COUNTRY_CODE:}
  external:
    identity:
      base-url: ${APP_EXTERNAL_IDENTITY_BASE_URL:http://identity-access-service}
      timeout-ms: ${APP_EXTERNAL_IDENTITY_TIMEOUT_MS:3000}
      actor-legitimacy-path: ${APP_EXTERNAL_IDENTITY_ACTOR_LEGITIMACY_PATH:/api/v1/internal/iam/users/{actorId}/permissions}
    directory:
      base-url: ${APP_EXTERNAL_DIRECTORY_BASE_URL:http://directory-service}
      timeout-ms: ${APP_EXTERNAL_DIRECTORY_TIMEOUT_MS:3000}
      retry:
        max-attempts: ${APP_EXTERNAL_DIRECTORY_RETRY_MAX_ATTEMPTS:2}
        backoff-ms: ${APP_EXTERNAL_DIRECTORY_RETRY_BACKOFF_MS:200}
      contacts-path: ${APP_EXTERNAL_DIRECTORY_CONTACTS_PATH:/api/v1/internal/organizations/{organizationId}/contacts}
    order:
      base-url: ${APP_EXTERNAL_ORDER_BASE_URL:http://order-service}
      timeout-ms: ${APP_EXTERNAL_ORDER_TIMEOUT_MS:3000}
      retry:
        max-attempts: ${APP_EXTERNAL_ORDER_RETRY_MAX_ATTEMPTS:2}
        backoff-ms: ${APP_EXTERNAL_ORDER_RETRY_BACKOFF_MS:200}
      order-path: ${APP_EXTERNAL_ORDER_ORDER_PATH:/api/v1/internal/orders/{orderId}/organization-context}
      cart-path: ${APP_EXTERNAL_ORDER_CART_PATH:/api/v1/internal/carts/{cartId}/organization-context}

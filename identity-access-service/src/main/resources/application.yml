spring:
  application:
    name: ${SPRING_APPLICATION_NAME:identity-access-service}
  config:
    import: "optional:configserver:${APP_CONFIG_SERVER_URI:http://localhost:8888}"
  cloud:
    config:
      enabled: ${APP_CONFIG_ENABLED:true}
      fail-fast: ${APP_CONFIG_FAIL_FAST:false}
      label: ${APP_CONFIG_LABEL:main}
      discovery:
        enabled: ${APP_CONFIG_DISCOVERY_ENABLED:false}
        service-id: ${APP_CONFIG_DISCOVERY_SERVICE_ID:config-server}
  main:
    web-application-type: reactive

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}
      validate-group-membership: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,kafka
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: ${APP_DEP_REDIS_ENABLED:true}
    kafka:
      enabled: ${APP_DEP_KAFKA_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.arka.identityaccess: ${LOG_LEVEL_APP:INFO}
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{traceId:-}/%X{correlationId:-}] %logger{36} - %msg%n}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: ${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER:alpha}
    tags-sorter: ${SPRINGDOC_SWAGGER_UI_TAGS_SORTER:alpha}

app:
  runtime:
    profile: ${SPRING_PROFILES_ACTIVE:}
  database:
    schema:
      initialize-on-startup: ${APP_DATABASE_SCHEMA_INITIALIZE_ON_STARTUP:false}
  dependencies:
    postgres:
      enabled: ${APP_DEP_POSTGRES_ENABLED:true}
    redis:
      enabled: ${APP_DEP_REDIS_ENABLED:true}
    kafka:
      enabled: ${APP_DEP_KAFKA_ENABLED:true}
  security:
    jwt:
      algorithm: ${APP_SECURITY_JWT_ALGORITHM:RS256}
      key-id: ${APP_SECURITY_JWT_KEY_ID:dev-rsa-key-1}
      private-key-path: ${APP_SECURITY_JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${APP_SECURITY_JWT_PUBLIC_KEY_PATH:}
      additional-public-keys: ${APP_SECURITY_JWT_ADDITIONAL_PUBLIC_KEYS:}
      issuer: ${APP_SECURITY_JWT_ISSUER:identity-access-service}
      audience: ${APP_SECURITY_JWT_AUDIENCE:arka-b2b}
      access-token-ttl-seconds: ${APP_SECURITY_JWT_ACCESS_TTL_SECONDS:900}
      refresh-token-ttl-seconds: ${APP_SECURITY_JWT_REFRESH_TTL_SECONDS:604800}
      clock-skew-seconds: ${APP_SECURITY_JWT_CLOCK_SKEW_SECONDS:60}
      jwks-path: ${APP_SECURITY_JWT_JWKS_PATH:/.well-known/jwks.json}
    s2s:
      enabled: ${APP_SECURITY_S2S_ENABLED:true}
      default-token-ttl-seconds: ${APP_SECURITY_S2S_DEFAULT_TOKEN_TTL_SECONDS:300}
      client-id: ${APP_SECURITY_S2S_CLIENT_ID:${spring.application.name}}
      client-secret: ${APP_SECURITY_S2S_CLIENT_SECRET:}
      audience: ${APP_SECURITY_S2S_AUDIENCE:arka-b2b}
      scopes: ${APP_SECURITY_S2S_SCOPES:notification.dispatch}
      identity-base-url: ${APP_SECURITY_S2S_IDENTITY_BASE_URL:http://identity-access-service}
      token-path: ${APP_SECURITY_S2S_TOKEN_PATH:/api/v1/internal/auth/service-token}
      timeout-ms: ${APP_SECURITY_S2S_TIMEOUT_MS:2000}
      refresh-skew-seconds: ${APP_SECURITY_S2S_REFRESH_SKEW_SECONDS:30}
      clients: {}
  redis:
    cache:
      introspection-ttl-seconds: ${APP_REDIS_CACHE_INTROSPECTION_TTL_SECONDS:30}
      permissions-ttl-seconds: ${APP_REDIS_CACHE_PERMISSIONS_TTL_SECONDS:30}
    rate-limit:
      login-requests-per-minute: ${APP_REDIS_RATE_LIMIT_LOGIN_RPM:10}
      refresh-requests-per-minute: ${APP_REDIS_RATE_LIMIT_REFRESH_RPM:30}
      register-founder-requests-per-minute: ${APP_REDIS_RATE_LIMIT_REGISTER_FOUNDER_RPM:5}
  kafka:
    topics:
      session-opened: ${APP_KAFKA_TOPIC_SESSION_OPENED:${APP_KAFKA_TOPIC_USER_LOGGED_IN:iam.session-opened.v1}}
      user-registered: ${APP_KAFKA_TOPIC_USER_REGISTERED:iam.user-registered.v1}
      account-activated: ${APP_KAFKA_TOPIC_ACCOUNT_ACTIVATED:iam.account-activated.v1}
      auth-failed: ${APP_KAFKA_TOPIC_AUTH_FAILED:iam.auth-failed.v1}
      session-refreshed: ${APP_KAFKA_TOPIC_SESSION_REFRESHED:iam.session-refreshed.v1}
      session-revoked: ${APP_KAFKA_TOPIC_SESSION_REVOKED:iam.session-revoked.v1}
      role-assigned: ${APP_KAFKA_TOPIC_ROLE_ASSIGNED:iam.user-role-assigned.v1}
      user-blocked: ${APP_KAFKA_TOPIC_USER_BLOCKED:iam.user-blocked.v1}
  outbox:
    relay:
      enabled: ${APP_OUTBOX_RELAY_ENABLED:true}
      batch-size: ${APP_OUTBOX_RELAY_BATCH_SIZE:200}
      poll-interval-ms: ${APP_OUTBOX_RELAY_POLL_INTERVAL_MS:2000}
      max-retries: ${APP_OUTBOX_RELAY_MAX_RETRIES:3}
  idempotency:
    processed-event:
      consumer-name: ${APP_IDEMPOTENCY_CONSUMER_NAME:identity-access-service}
  external:
    notification:
      base-url: ${APP_EXTERNAL_NOTIFICATION_BASE_URL:http://localhost:8086}
      service-token: ${APP_EXTERNAL_NOTIFICATION_SERVICE_TOKEN:${APP_SECURITY_SERVICE_SHARED_TOKEN:}}
      timeout-ms: ${APP_EXTERNAL_NOTIFICATION_TIMEOUT_MS:3000}
      emit-path: ${APP_EXTERNAL_NOTIFICATION_EMIT_PATH:/api/v1/notifications}

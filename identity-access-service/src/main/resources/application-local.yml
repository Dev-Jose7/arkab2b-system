spring:
  r2dbc:
    url: ${APP_LOCAL_R2DBC_URL:r2dbc:postgresql://localhost:5432/identity_access}
    username: ${APP_LOCAL_R2DBC_USERNAME:identity_access}
    password: ${APP_LOCAL_R2DBC_PASSWORD:identity_access}
    pool:
      enabled: ${APP_LOCAL_R2DBC_POOL_ENABLED:true}
      initial-size: ${APP_LOCAL_R2DBC_POOL_INITIAL_SIZE:5}
      max-size: ${APP_LOCAL_R2DBC_POOL_MAX_SIZE:20}
  data:
    redis:
      host: ${APP_LOCAL_REDIS_HOST:localhost}
      port: ${APP_LOCAL_REDIS_PORT:6379}
      password: ${APP_LOCAL_REDIS_PASSWORD:}
      timeout: ${APP_LOCAL_REDIS_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${APP_LOCAL_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${APP_LOCAL_KAFKA_CLIENT_ID:identity-access-service-local}
    listener:
      missing-topics-fatal: ${APP_LOCAL_KAFKA_LISTENER_MISSING_TOPICS_FATAL:false}
    producer:
      acks: ${APP_LOCAL_KAFKA_PRODUCER_ACKS:all}
      retries: ${APP_LOCAL_KAFKA_PRODUCER_RETRIES:3}
      properties:
        enable.idempotence: ${APP_LOCAL_KAFKA_PRODUCER_ENABLE_IDEMPOTENCE:true}
    consumer:
      group-id: ${APP_LOCAL_KAFKA_CONSUMER_GROUP_ID:identity-access-service-local}
      auto-offset-reset: ${APP_LOCAL_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: ${APP_LOCAL_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:false}

app:
  database:
    schema:
      initialize-on-startup: ${APP_DATABASE_SCHEMA_INITIALIZE_ON_STARTUP:true}
  security:
    jwt:
      private-key-path: ${APP_SECURITY_JWT_PRIVATE_KEY_PATH:file:${APP_LOCAL_SECRETS_DIR:${user.dir}/../platform/secrets/local}/identity-access-private.pem}
      public-key-path: ${APP_SECURITY_JWT_PUBLIC_KEY_PATH:file:${APP_LOCAL_SECRETS_DIR:${user.dir}/../platform/secrets/local}/identity-access-public.pem}

spring:
  r2dbc:
    url: ${APP_PROD_R2DBC_URL}
    username: ${APP_PROD_R2DBC_USERNAME}
    password: ${APP_PROD_R2DBC_PASSWORD}
    pool:
      enabled: ${APP_PROD_R2DBC_POOL_ENABLED:true}
      initial-size: ${APP_PROD_R2DBC_POOL_INITIAL_SIZE:20}
      max-size: ${APP_PROD_R2DBC_POOL_MAX_SIZE:80}
  data:
    redis:
      host: ${APP_PROD_REDIS_HOST}
      port: ${APP_PROD_REDIS_PORT:6379}
      password: ${APP_PROD_REDIS_PASSWORD:}
      timeout: ${APP_PROD_REDIS_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${APP_PROD_KAFKA_BOOTSTRAP_SERVERS}
    client-id: ${APP_PROD_KAFKA_CLIENT_ID:order-service-prod}

app:
  database:
    schema:
      initialize-on-startup: ${APP_DATABASE_SCHEMA_INITIALIZE_ON_STARTUP:false}
  outbox:
    relay:
      enabled: ${APP_OUTBOX_RELAY_ENABLED:true}

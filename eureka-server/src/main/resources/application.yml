spring:
  application:
    name: eureka-server

server:
  port: ${SERVER_PORT:8761}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,ping
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      system: ${MANAGEMENT_METRICS_TAG_SYSTEM:arkab2b}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{traceId:-}/%X{correlationId:-}] %logger{36} - %msg%n}

eureka:
  instance:
    hostname: ${APP_EUREKA_HOSTNAME:localhost}
    prefer-ip-address: false
  client:
    register-with-eureka: ${APP_EUREKA_REGISTER_WITH_EUREKA:false}
    fetch-registry: ${APP_EUREKA_FETCH_REGISTRY:false}
    service-url:
      defaultZone: ${APP_EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  server:
    enable-self-preservation: ${APP_EUREKA_SELF_PRESERVATION:false}
    renewal-percent-threshold: ${APP_EUREKA_RENEWAL_PERCENT_THRESHOLD:0.85}
    wait-time-in-ms-when-sync-empty: ${APP_EUREKA_WAIT_SYNC_EMPTY_MS:0}

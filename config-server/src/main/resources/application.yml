spring:
  application:
    name: config-server
  profiles:
    include: native
  cloud:
    config:
      server:
        native:
          search-locations: ${APP_CONFIG_REPO_PATH:file:${user.dir}/../platform/config-repo}
        # git:
        #   uri: ${APP_CONFIG_GIT_URI:https://git.example.com/arkab2b-config.git}
        #   default-label: ${APP_CONFIG_GIT_DEFAULT_LABEL:main}
        #   search-paths: ${APP_CONFIG_GIT_SEARCH_PATHS:config}
        #   username: ${APP_CONFIG_GIT_USERNAME:}
        #   password: ${APP_CONFIG_GIT_PASSWORD:}

server:
  port: ${SERVER_PORT:8888}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,ping
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      system: ${MANAGEMENT_METRICS_TAG_SYSTEM:arkab2b}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{traceId:-}/%X{correlationId:-}] %logger{36} - %msg%n}

eureka:
  client:
    enabled: ${APP_EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: ${APP_EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${APP_EUREKA_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${APP_EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}

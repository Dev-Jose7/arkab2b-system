      APP_EXTERNAL_IDENTITY_BASE_URL: "http://identity-access-service:${ARKAB2B_IAM_PORT:-8081}"
      APP_EXTERNAL_DIRECTORY_BASE_URL: "http://directory-service:${ARKAB2B_DIRECTORY_PORT:-8082}"
    ports:
      - "${ARKAB2B_PRIVATE_BIND_ADDRESS:-0.0.0.0}:${ARKAB2B_CATALOG_PORT:-8083}:${ARKAB2B_CATALOG_PORT:-8083}"

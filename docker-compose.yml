      APP_EUREKA_DEFAULT_ZONE: "http://eureka-server:${ARKAB2B_EUREKA_SERVER_PORT:-8761}/eureka"
      APP_DATABASE_SCHEMA_INITIALIZE_ON_STARTUP: "true"
      APP_LOCAL_R2DBC_URL: "r2dbc:postgresql://postgres:5432/directory"
      APP_LOCAL_R2DBC_USERNAME: "directory"
      APP_LOCAL_R2DBC_PASSWORD: "directory"
      APP_LOCAL_REDIS_HOST: redis
      APP_LOCAL_REDIS_PORT: "6379"
      APP_LOCAL_REDIS_PASSWORD: ""
      APP_LOCAL_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      APP_SECURITY_JWT_JWKS_URI: "http://identity-access-service:${ARKAB2B_IAM_PORT:-8081}/.well-known/jwks.json"
      APP_EXTERNAL_IDENTITY_BASE_URL: "http://identity-access-service:${ARKAB2B_IAM_PORT:-8081}"
    ports:
      - "${ARKAB2B_PRIVATE_BIND_ADDRESS:-0.0.0.0}:${ARKAB2B_DIRECTORY_PORT:-8082}:${ARKAB2B_DIRECTORY_PORT:-8082}"
    volumes:
      - ./directory-service/build/libs:/app:ro
    networks:
      arkab2b-net:

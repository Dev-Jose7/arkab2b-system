      APP_SECURITY_JWT_JWKS_URI: "http://identity-access-service:${ARKAB2B_IAM_PORT:-8081}/.well-known/jwks.json"
      APP_EXTERNAL_IDENTITY_BASE_URL: "http://identity-access-service:${ARKAB2B_IAM_PORT:-8081}"
      APP_EXTERNAL_DIRECTORY_BASE_URL: "http://directory-service:${ARKAB2B_DIRECTORY_PORT:-8082}"
      APP_EXTERNAL_CATALOG_BASE_URL: "http://catalog-service:${ARKAB2B_CATALOG_PORT:-8083}"
      APP_EXTERNAL_ORDER_BASE_URL: "http://order-service:${ARKAB2B_ORDER_PORT:-8085}"
    ports:
      - "${ARKAB2B_PRIVATE_BIND_ADDRESS:-0.0.0.0}:${ARKAB2B_INVENTORY_PORT:-8084}:${ARKAB2B_INVENTORY_PORT:-8084}"
    volumes:

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArkaB2B Swagger Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fff;
    }
    #swagger-ui {
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    const serviceSpecs = {
      iam: "/swagger/iam/v1/api-docs",
      directory: "/swagger/directory/v1/api-docs",
      catalog: "/swagger/catalog/v1/api-docs",
      inventory: "/swagger/inventory/v1/api-docs",
      order: "/swagger/order/v1/api-docs",
      notification: "/swagger/notification/v1/api-docs",
      reporting: "/swagger/reporting/v1/api-docs"
    };

    const params = new URLSearchParams(window.location.search);
    const service = params.get("service") || "iam";
    const specUrl = serviceSpecs[service] || serviceSpecs.iam;
    const initialTarget = sanitizeTarget({
      method: params.get("method"),
      path: params.get("path"),
      operationId: params.get("operationId"),
      tag: params.get("tag")
    });

    document.title = `ArkaB2B Swagger Viewer - ${service}`;

    function normalizePath(value) {
      return String(value || "").replace(/\/+$/, "");
    }

    function sanitizeTarget(value) {
      return {
        method: String((value && value.method) || "").toLowerCase(),
        path: String((value && value.path) || ""),
        operationId: String((value && value.operationId) || ""),
        tag: String((value && value.tag) || "")
      };
    }

    function openOperationBlock(operationBlock) {
      if (!operationBlock) return false;
      const tagSection = operationBlock.closest(".opblock-tag-section");
      if (tagSection && !tagSection.classList.contains("is-open")) {
        const tagButton = tagSection.querySelector(".opblock-tag");
        if (tagButton) tagButton.click();
      }
      const summaryButton = operationBlock.querySelector(".opblock-summary-control");
      if (summaryButton && !operationBlock.classList.contains("is-open")) {
        summaryButton.click();
      }
      operationBlock.scrollIntoView({ behavior: "smooth", block: "center" });
      return true;
    }

    function findOperationByMethodAndPath(target) {
      if (!target.method || !target.path) return null;
      const expectedPath = normalizePath(target.path);
      const blocks = Array.from(document.querySelectorAll(".opblock"));
      return blocks.find((block) => {
        const blockMethod = String(block.getAttribute("data-method") || "").toLowerCase();
        const blockPath = normalizePath(block.getAttribute("data-path"));
        return blockMethod === target.method && blockPath === expectedPath;
      }) || null;
    }

    function findOperationById(target) {
      if (!target.operationId) return null;
      const idNeedle = String(target.operationId).toLowerCase();
      const blocks = Array.from(document.querySelectorAll(".opblock"));
      return blocks.find((block) => {
        const blockId = String(block.id || "").toLowerCase();
        return blockId.includes(idNeedle);
      }) || null;
    }

    function applyDeepLinkHash(target) {
      if (!target.tag || !target.operationId) return;
      window.location.hash = `#/${encodeURIComponent(target.tag)}/${encodeURIComponent(target.operationId)}`;
    }

    function focusTargetOperationWithRetry(rawTarget) {
      const target = sanitizeTarget(rawTarget);
      if (!target.method && !target.path && !target.operationId) return;
      applyDeepLinkHash(target);
      let attempts = 0;
      const maxAttempts = 24;
      const timer = setInterval(() => {
        attempts += 1;
        const byMethodPath = findOperationByMethodAndPath(target);
        const byOperationId = findOperationById(target);
        if (openOperationBlock(byMethodPath || byOperationId) || attempts >= maxAttempts) {
          clearInterval(timer);
        }
      }, 250);
    }

    function handleParentMessage(event) {
      if (event.origin !== window.location.origin) return;
      const payload = event.data || {};
      if (payload.type !== "ARKAB2B_SWAGGER_FOCUS_OPERATION") return;
      focusTargetOperationWithRetry(payload.target || {});
    }

    window.addEventListener("message", handleParentMessage);

    window.ui = SwaggerUIBundle({
      url: specUrl,
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIStandalonePreset
      ],
      plugins: [
        SwaggerUIBundle.plugins.DownloadUrl
      ],
      layout: "StandaloneLayout",
      onComplete: () => {
        focusTargetOperationWithRetry(initialTarget);
      }
    });
  </script>
</body>
</html>
